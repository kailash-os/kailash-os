name: flake-check

# The OS root flake's evaluation + host-composition gate on hosted runners
# (replaces the layout scaffold once the flake landed — KA-01/KA-02 done,
# 5c1fcd2). One runner per declared system: `nix flake check` (current-system
# scope) on each, so both hosts evaluate and the
# checks.x86_64-linux.kailash-minimal-toplevel system-closure derivation is
# exercised on the hosted surface (the authoritative check per the
# engineering standard; local runs are development evidence only).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, system: x86_64-linux }
          - { os: ubuntu-24.04-arm, system: aarch64-linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Flake check (${{ matrix.system }})
        run: nix flake check
      - name: Minimum closure evaluates (${{ matrix.system }})
        run: |
          nix eval .#nixosConfigurations.kailash-minimal.config.system.build.toplevel.drvPath
