name: flake-check

# The OS root flake's evaluation + host-composition gate on hosted runners
# (replaces the layout scaffold once the flake landed — KA-01/KA-02 done,
# 5c1fcd2). One runner per declared system: `nix flake check` (current-system
# scope) on each, so both hosts evaluate and the
# checks.x86_64-linux.kailash-minimal-toplevel system-closure derivation is
# exercised on the hosted surface (the authoritative check per the
# engineering standard; local runs are development evidence only).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  flake-check:
    # The aarch64 row is SUSPENDED (issue #186): the root flake registers
    # zero checks.aarch64-linux legs (68 on x86_64-linux), so the arm job
    # gated nothing — plain `nix flake check` there is eval-only theatre
    # ("omitted these incompatible systems: x86_64-linux") that stayed
    # green while legs failed for two committed rounds (run 38338309343,
    # a-08-generated-drift). It returns the moment the flake declares its
    # first aarch64 leg: re-add `{ os: ubuntu-24.04-arm, system:
    # aarch64-linux }` in the same cycle that leg lands — no gate leg
    # that gates nothing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, system: x86_64-linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # Trust the kailash cache (plan §8.4): the flake's
          # nixConfig.extra-substituters is ignored on hosted runners
          # ("ignoring untrusted flake configuration setting"), so
          # every check run rebuilds tool derivations the cache
          # already holds. Lining it up here makes flake-check pull
          # before it builds.
          extra-conf: |
            extra-substituters = https://kailash.cachix.org
            extra-trusted-public-keys = kailash.cachix.org-1:HnASOtfS7XRjQBrH9umnPljPRjvHeJKDvwZDYXt+sKM=
      - name: Flake check (${{ matrix.system }})
        run: nix flake check
      - name: Minimum closure evaluates (${{ matrix.system }})
        run: |
          nix eval .#nixosConfigurations.kailash-minimal.config.system.build.toplevel.drvPath
      - name: Cachix (kailash) — push daemon
        uses: cachix/cachix-action@v17
        with:
          name: kailash
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
