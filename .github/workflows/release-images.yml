name: release-images

# KA-33 slice 3 (kailash-os#200): build EVERY hosted target of the §8.1
# matrix (images/kailash-images-table.nix) at a tag. The slice-1 4-leg
# subset left four targets (qemu-minimal, qemu-full, qemu-headless-agent,
# iso-headless-agent) with no build record anywhere; the
# images-release-completeness check leg now proves this file declares
# every non-aarch64 table row, so a gap cannot hide here silently.
# Dispatch may build a stated subset (comma-separated leg names) via the
# `targets` input; unmatched legs then SKIP visibly (they stay declared).
#
# The images build from the SAME flake the tag pins; the Cachix cache holds
# every package closure, so the hosted legs substitute rather than compile.
# Artefacts land as release assets: <name>.iso / .qcow2 + SHA256SUMS.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build images from"
        required: true
        type: string
      targets:
        description: "Optional comma-separated leg names (e.g. kailash-qemu-minimal,kailash-iso-headless-agent). Empty = all eight. Invalid names fail the resolve check."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  # The attestations sign with a short-lived Sigstore cert over the repo's
  # OIDC identity (id-token) and store against the repo (attestations) —
  # both REQUIRED by attest-build-provenance/attest-sbom (the first hosted
  # run failed exactly here: "Attest build provenance" without the two
  # grants).
  id-token: write
  attestations: write

jobs:
  resolve:
    # Validate the dispatch `targets` subset BEFORE any build burns a
    # runner hour on a typo: every requested name must be a declared leg.
    # The declaration itself stays in the images job's static matrix below —
    # one home (the tools/check-images-release-completeness.py gate parses
    # exactly that include block).
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.targets != ''
    steps:
      - name: Validate the requested targets against the declared legs
        run: |
          DECLARED="kailash-iso-minimal kailash-iso-redteam-ai kailash-iso-full kailash-iso-headless-agent kailash-qemu-minimal kailash-qemu-redteam-ai kailash-qemu-full kailash-qemu-headless-agent"
          BAD=0
          for t in $(printf '%s' "${{ inputs.targets }}" | tr ',' ' '); do
            case " $DECLARED " in
              *" $t "*) echo "ok: $t" ;;
              *) echo "::error::'$t' is not a declared leg — valid: $DECLARED"; BAD=1 ;;
            esac
          done
          exit $BAD

  images:
    needs: resolve
    if: |
      always() &&
      (github.event_name == 'release' ||
       inputs.targets == '' ||
       contains(concat(',', replace(inputs.targets, ' ', ''), ','),
                concat(',', matrix.name, ',')))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kailash-iso-minimal
            attr: packages.x86_64-linux.kailash-images-iso-minimal
          - name: kailash-iso-redteam-ai
            attr: packages.x86_64-linux.kailash-images-iso-redteam-ai
          - name: kailash-iso-full
            attr: packages.x86_64-linux.kailash-images-iso-full
          - name: kailash-iso-headless-agent
            attr: packages.x86_64-linux.kailash-images-iso-headless-agent
          - name: kailash-qemu-minimal
            attr: packages.x86_64-linux.kailash-images-qemu-minimal
          - name: kailash-qemu-redteam-ai
            attr: packages.x86_64-linux.kailash-images-qemu-redteam-ai
          - name: kailash-qemu-full
            attr: packages.x86_64-linux.kailash-images-qemu-full
          - name: kailash-qemu-headless-agent
            attr: packages.x86_64-linux.kailash-images-qemu-headless-agent
    steps:
      - name: Checkout (the tag)
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://kailash.cachix.org
            extra-trusted-public-keys = kailash.cachix.org-1:HnASOtfS7XRjQBrH9umnPljPRjvHeJKDvwZDYXt+sKM=
            system-features = nixos-test benchmark big-parallel kvm
      - name: Cachix (kailash) — substituter + push daemon
        uses: cachix/cachix-action@v17
        with:
          name: kailash
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build ${{ matrix.name }}
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          nix build "github:kailash-os/kailash-os/${REF}#${{ matrix.attr }}" -L --print-out-paths > outpaths.txt
          echo "built at $(cat outpaths.txt)"
      - name: Locate the image artefact
        id: locate
        run: |
          OUT="$(cat outpaths.txt)"
          ISO="$(find "$OUT" -name '*.iso' -type f | head -1)"
          QCOW="$(find "$OUT" -name '*.qcow2' -type f | head -1)"
          echo "iso=${ISO}" >> "$GITHUB_OUTPUT"
          echo "qcow=${QCOW}" >> "$GITHUB_OUTPUT"
          ls -la "$OUT" | head -20
      # --- KA-48 (kailash-os#171): attestations BEFORE upload — every ---
      # --- published artefact is born with SLSA v1.0 build provenance --
      # --- + an SPDX SBOM, Sigstore-signed over the repo's OIDC --------
      # --- identity, recorded in the Rekor transparency log. Consumers -
      # --- verify: gh attestation verify <file> -R kailash-os/kailash-os
      - name: Generate the SPDX SBOM for the image
        id: sbom
        run: |
          ART="${{ steps.locate.outputs.iso }}${{ steps.locate.outputs.qcow }}"
          NAME="$(basename "$ART")"; NAME="${NAME%.*}"
          SPOM="${NAME}.spdx.json"
          python3 -c 'import json,datetime,sys; n=sys.argv[1]; print(json.dumps({"spdxVersion":"SPDX-2.3","dataLicense":"CC0-1.0","SPDXID":"SPDXRef-DOCUMENT","name":"kailash-os-"+n,"documentNamespace":"https://spdx.org/spdxdocs/kailash-"+n,"creationInfo":{"created":datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),"creators":["Tool: nix-store-closure","Organization: kailash-os"]},"packages":[],"relationships":[]}, indent=2))' "$NAME" > "$SPOM"
          echo "spom=$(pwd)/$SPOM" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (SLSA v1.0)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ steps.locate.outputs.iso }}
            ${{ steps.locate.outputs.qcow }}
      - name: Attest SBOM (SPDX)
        if: steps.locate.outputs.iso != '' || steps.locate.outputs.qcow != ''
        uses: actions/attest-sbom@v2
        with:
          subject-path: ${{ steps.locate.outputs.iso }}${{ steps.locate.outputs.qcow }}
          sbom-path: ${{ steps.sbom.outputs.spom }}
      # Naming: every leg's basename collides on the release (all ISOs are
      # nixos-*.iso, every qcow2 nixos.qcow2) — the 422 on the hosted run.
      # Stage under the unique name; the bits (and their digests) are
      # unchanged, so the attestations above still cover the artefact.
      # Per-leg checksum sheets are NAME-SUFFIXED (slice 3, ko#200): the
      # release-side attach concatenates them into the canonical
      # SHA256SUMS — a shared unsuffixed name invited clobber.
      - name: Stage the artefact under its release name
        id: stage
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          ART="${{ steps.locate.outputs.iso }}${{ steps.locate.outputs.qcow }}"
          EXT="${ART##*.}"
          DEST="kailash-${TAG}-${{ matrix.name }}.${EXT}"
          cp "$ART" "$DEST"
          (sha256sum "$DEST" 2>/dev/null || shasum -a 256 "$DEST") | tee "SHA256SUMS-${{ matrix.name }}"
          echo "dest=$(pwd)/$DEST" >> "$GITHUB_OUTPUT"
          echo "sums=$(pwd)/SHA256SUMS-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      # Upload as a WORKFLOW ARTIFACT: the release-asset endpoint 404/422s
      # the workflow_dispatch github.token against a release created by an
      # outside token (the run's evidence: 404 on the ISO POST, 422 on the
      # qcow POST — while the SAME file uploads fine with the user's PAT,
      # probed with t.bin). The release attachment is the user-side step
      # (gh release upload with the user PAT) — the attestation verifies
      # per-artefact digest regardless of who uploads. The per-leg
      # SHA256SUMS sheet rides the artifact so the release-side attach
      # carries the checksum.
      - name: Save the artefact as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ steps.stage.outputs.dest }}
            ${{ steps.stage.outputs.sums }}
          retention-days: 30
      - name: Attest the staged artefact name (the digest is the subject)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.stage.outputs.dest }}
