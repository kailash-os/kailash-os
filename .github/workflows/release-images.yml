name: release-images

# KA-33 slice 3 (kailash-os#200; PR #201 merge follow-up): the #201
# images job `if` used replace() — not a GitHub Actions expression
# function — so this file never registered its triggers (every push run
# failed at startup with zero jobs; workflow_dispatch 422'd "not a
# valid workflow"). This version carries only GHA-legal expressions:
# dispatch's optional `targets` input resolves through a tiny resolve
# job that validates the requested names and filters the STATIC 8-leg
# declaration below to the subset — jq-side, no expression gymnastics.
# The static matrix stays the ONE declaration of the hosted leg set
# (the completeness gate parses exactly this include block).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build images from"
        required: true
        type: string
      targets:
        description: "Optional comma-separated leg names (e.g. kailash-qemu-minimal,kailash-iso-headless-agent). Empty = all eight."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  # The attestations sign with a short-lived Sigstore cert over the repo's
  # OIDC identity (id-token) and store against the repo (attestations) —
  # both REQUIRED by attest-build-provenance/attest-sbom (the first hosted
  # run failed exactly here: "Attest build provenance" without the two
  # grants).
  id-token: write
  attestations: write

jobs:
  resolve:
    # On release events and empty-targets dispatches this passes the full
    # static declaration through (the images job then runs all eight
    # legs). On a targeted dispatch it VALIDATES every requested name
    # against the declared legs (a typo REDs here before any runner hour
    # burns) and outputs the subset — a FILTER of the declaration below,
    # never a re-declaration.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Resolve the matrix (full, or the requested subset)
        id: set
        env:
          TARGETS: ${{ inputs.targets || '' }}
        run: |
          cat > /tmp/all-legs.json <<'JSON'
          {"include":[
            {"name":"kailash-iso-minimal","attr":"packages.x86_64-linux.kailash-images-iso-minimal"},
            {"name":"kailash-iso-redteam-ai","attr":"packages.x86_64-linux.kailash-images-iso-redteam-ai"},
            {"name":"kailash-iso-full","attr":"packages.x86_64-linux.kailash-images-iso-full"},
            {"name":"kailash-iso-headless-agent","attr":"packages.x86_64-linux.kailash-images-iso-headless-agent"},
            {"name":"kailash-qemu-minimal","attr":"packages.x86_64-linux.kailash-images-qemu-minimal"},
            {"name":"kailash-qemu-redteam-ai","attr":"packages.x86_64-linux.kailash-images-qemu-redteam-ai"},
            {"name":"kailash-qemu-full","attr":"packages.x86_64-linux.kailash-images-qemu-full"},
            {"name":"kailash-qemu-headless-agent","attr":"packages.x86_64-linux.kailash-images-qemu-headless-agent"}
          ]}
          JSON
          if [ -z "$(printf '%s' "$TARGETS" | tr -d ' ,')" ]; then
            echo "targets: ALL eight hosted legs"
            jq -c . /tmp/all-legs.json > matrix.json
          else
            jq -c --arg ts "$TARGETS" '
              ($ts | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $want
              | {include: [.include[] | select(.name as $n | $want | index($n))]}' \
              /tmp/all-legs.json > matrix.json
            COUNT="$(jq '.include | length' matrix.json)"
            WANTED="$(printf '%s' "$TARGETS" | tr ',' ' ' | wc -w | tr -d ' ')"
            if [ "$COUNT" -ne "$WANTED" ]; then
              echo "::error::unmatched target name(s) in '${TARGETS}' — valid legs: $(jq -r '.include[].name' /tmp/all-legs.json | tr '\n' ' ')"
              exit 1
            fi
            echo "targets: ${COUNT} requested leg(s) selected"
          fi
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  images:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout (the tag)
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://kailash.cachix.org
            extra-trusted-public-keys = kailash.cachix.org-1:HnASOtfS7XRjQBrH9umnPljPRjvHeJKDvwZDYXt+sKM=
            system-features = nixos-test benchmark big-parallel kvm
      - name: Cachix (kailash) — substituter + push daemon
        uses: cachix/cachix-action@v17
        with:
          name: kailash
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build ${{ matrix.name }}
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          nix build "github:kailash-os/kailash-os/${REF}#${{ matrix.attr }}" -L --print-out-paths > outpaths.txt
          echo "built at $(cat outpaths.txt)"
      - name: Locate the image artefact
        id: locate
        run: |
          OUT="$(cat outpaths.txt)"
          ISO="$(find "$OUT" -name '*.iso' -type f | head -1)"
          QCOW="$(find "$OUT" -name '*.qcow2' -type f | head -1)"
          find "$OUT" -maxdepth 1 -type f -exec ls -la {} +
          echo "iso=${ISO}" >> "$GITHUB_OUTPUT"
          echo "qcow=${QCOW}" >> "$GITHUB_OUTPUT"
      # --- KA-48 (kailash-os#171): attestations BEFORE upload — every ---
      # --- published artefact is born with SLSA v1.0 build provenance --
      # --- + an SPDX SBOM, Sigstore-signed over the repo's OIDC --------
      # --- identity, recorded in the Rekor transparency log. Consumers -
      # --- verify: gh attestation verify <file> -R kailash-os/kailash-os
      # KA-33.4 (kailash-os#206): artefacts ABOVE the 2 147 483 648-byte
      # asset cap stage CHUNKED (split parts + parts sheet) so every
      # matrix artefact can live on the release; under-cap artefacts keep
      # the single-file artifact. The attested subject is the WHOLE
      # artefact — the split is lossless packaging, the reassembled file
      # re-verifies against the original records.
      - name: Package the artefact (chunk when over the asset cap)
        id: package
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          ART="${{ steps.locate.outputs.iso }}${{ steps.locate.outputs.qcow }}"
          SIZE="$(stat -c%s "$ART")"
          EXT="${ART##*.}"
          NAME="kailash-${TAG}-${{ matrix.name }}.${EXT}"
          cp "$ART" "$NAME"
          if [ "$SIZE" -lt 2147483648 ]; then
            echo "mode=single" >> "$GITHUB_OUTPUT"
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
            (sha256sum "$NAME" 2>/dev/null || shasum -a 256 "$NAME") | tee "SHA256SUMS-${{ matrix.name }}"
            echo "sums=$(pwd)/SHA256SUMS-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=chunked" >> "$GITHUB_OUTPUT"
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
            bash tools/split-release-artefact.sh split "$NAME" .
            echo "sums=$(pwd)/SHA256SUMS-parts-$NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the artefact as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.sums }}
          retention-days: 30
      - name: Generate the SPDX SBOM for the image
        id: sbom
        run: |
          ART="${{ steps.locate.outputs.iso }}${{ steps.locate.outputs.qcow }}"
          NAME="$(basename "$ART")"; NAME="${NAME%.*}"
          SPOM="${NAME}.spdx.json"
          python3 -c 'import json,datetime,sys; n=sys.argv[1]; print(json.dumps({"spdxVersion":"SPDX-2.3","dataLicense":"CC0-1.0","SPDXID":"SPDXRef-DOCUMENT","name":"kailash-os-"+n,"documentNamespace":"https://spdx.org/spdxdocs/kailash-"+n,"creationInfo":{"created":datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),"creators":["Tool: nix-store-closure","Organization: kailash-os"]},"packages":[],"relationships":[]}, indent=2))' "$NAME" > "$SPOM"
          echo "spom=$(pwd)/$SPOM" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (SLSA v1.0)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ steps.locate.outputs.iso }}
            ${{ steps.locate.outputs.qcow }}
      - name: Attest SBOM (SPDX)
        if: steps.locate.outputs.iso != '' || steps.locate.outputs.qcow != ''
        uses: actions/attest-sbom@v2
        with:
          subject-path: ${{ steps.locate.outputs.iso }}${{ steps.locate.outputs.qcow }}
          sbom-path: ${{ steps.sbom.outputs.spom }}
      # Naming: every leg's basename collides on the release (all ISOs are
      # nixos-*.iso, every qcow2 nixos.qcow2) — the 422 on the hosted run.
      # The Package step (above) stages under the unique release name —
      # single-file or chunked — and emits the per-leg (per-part) sheets.
      # The staged Artefact upload rides directly above; the release-side
      # attach is the user-PAT step (the endpoint 404/422s the dispatch
      # token — the t.bin probe evidence).
      - name: Attest the staged artefact name (the digest is the subject)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.package.outputs.name }}
