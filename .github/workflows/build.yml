name: build

# KA-15.1 (#88, plan §8.3/§8.10): the manifest→matrix CI pipeline.
#
#   job1 manifest      — run the committed generator (tools/manifest-matrix.py)
#                        against the PINNED packages rev (read from the committed
#                        flake.lock; the codeload fetch is pinned to that rev — no
#                        floating heads) and emit the build matrix
#   job2 build-packages— one nix build leg per matrix entry (the packages overlay
#                        flake carries the derivations: pkgs/ auto-call today,
#                        manifest-driven at KA-05)
#   job3 vm-tests      — PENDING placeholder (plan §8.2: per-category VM tests
#                        land with KA-06/KA-13; needs a Linux VM gate, not this
#                        hosted-runner shape)
#
# Cachix: the `kailash` cache push is included COMMENTED below — the
# CACHIX_AUTH_TOKEN secret is not configured yet (verified empty in the
# repo's actions secrets). Uncomment both blocks once the secret lands.
# The attic fallback (plan §8.4) documents at cache.kailash.tools when
# self-hosted.
#
# NOTE: the `kailash` cache is LIVE and public (kailash.cachix.org;
# public key kailash.cachix.org-1:HnASOtfS7XRjQBrH9umnPljPRjvHeJKDvwZDYXt+
# sKM=, verified from the cachix API). CACHIX_AUTH_TOKEN is an org-level
# secret shared by both repos; the flake's nixConfig carries the
# substituter + key (the nixified-ai pattern, plan §8.3).

# PATH SCOPING (kailash-os#194): the build matrix compiles the taxonomy into
# package-derivation builds — a change that cannot touch a derivation input
# (docs, the website mirror, repo meta) does not pay for 34 nix builds. The
# ruleset's required checks (flake-check x86_64-linux + dependency-review,
# .github/workflows/flake-check.yml) stay PATH-INDEPENDENT: they evaluate the
# FULL option tree on every PR, so a manifest-affecting change that dodged
# these paths would still RED at eval. The workflow re-arms itself (its own
# path is in the list). Pushes to master ALWAYS run the matrix regardless of
# path — the cache is fed from master whatever landed (ko#175/ko#108: the
# build.yml push legs warm the kailash cachix for the next PR's cold pulls).
on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "packages/**"
      - "profiles/**"
      - "images/**"
      - "menu/**"
      - "cli/**"
      - "tests/**"
      - "generated/**"
      - "tools/**"
      - ".github/workflows/build.yml"
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyyaml (the manifest job parses the pinned tools.yaml)
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Generator self-test (the generator gates itself)
        run: python3 tools/manifest-matrix.py --self-test
      # KA-20.1 (#116): the README category table is generated from the
      # taxonomy (the no-hand-sync rule) — the gate asserts the committed
      # README span matches categories.yaml exactly, failing with a
      # unified diff on hand-drift. Default source = the live manifest
      # (kailash-packages main HEAD), so a manifest merge that moves the
      # census flips this leg red until the table is regenerated.
      - name: README category-table drift gate (tools/generate-readme-table.py)
        run: python3 tools/generate-readme-table.py --check
      - name: Emit build matrix from the pinned packages rev
        id: matrix
        run: |
          OUT="$(python3 tools/manifest-matrix.py)"
          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Matrix summary
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.matrix.outputs.matrix }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

  build-packages:
    needs: manifest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.manifest.outputs.matrix) }}
    runs-on: ${{ matrix.system == 'x86_64-linux' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # Trust the kailash cache as a substituter for THIS job. The
          # pinned-packages flake's nixConfig.extra-substituters is
          # ignored on hosted runners (run-log proof: "warning: ignoring
          # untrusted flake configuration setting 'extra-substituters'"),
          # so without these lines every leg rebuilds from source even
          # when the cache holds the artifacts. The Cachix action below
          # must also run BEFORE the build step: its daemon pushes paths
          # via the post-build hook — ordering after the build (the old
          # arrangement) started and stopped the daemon with zero paths
          # pushed (art aarch64 leg of kailash-packages run 38131821227).
          extra-conf: |
            extra-substituters = https://kailash.cachix.org
            extra-trusted-public-keys = kailash.cachix.org-1:HnASOtfS7XRjQBrH9umnPljPRjvHeJKDvwZDYXt+sKM=
      # --- Cachix (kailash, plan §8.3) — BEFORE the build, not after: ---
      # --- register the substituter (pull side) + run the push daemon
      # --- (post-build hook) for everything this leg builds.
      - name: Cachix (kailash) — substituter + push daemon
        uses: cachix/cachix-action@v17
        with:
          name: kailash
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Resolve the pinned packages flake
        id: pin
        run: |
          REV="$(python3 tools/manifest-matrix.py --print-rev)"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "Resolved kailash-packages pin: $REV"
      - name: Build .#packages.<system>.<package> from the pinned overlay
        run: |
          nix build "github:kailash-os/kailash-packages/${{ steps.pin.outputs.rev }}#packages.${{ matrix.system }}.${{ matrix.package }}" -L

  vm-tests:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: PENDING (KA-15.1 #88, plan §8.2) — VM test harness lands with KA-06/KA-13
        run: |
          echo "vm-tests: placeholder — per-category VM tests (plan §8.2) land with KA-06/KA-13"
          echo "This job exists to pin the pipeline position: manifest -> packages -> VM tests -> images."
